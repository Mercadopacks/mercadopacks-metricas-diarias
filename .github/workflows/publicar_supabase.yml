name: Publicar a Supabase

# Automatizado desde 2026-11-16 (ver reglas_de_negocio.md sección 21) vía
# cron-job.org disparando workflow_dispatch — MISMO mecanismo que
# descarga_diaria.yml y por la misma razón (el `schedule:` nativo de
# GitHub Actions llega con 4-5h de atraso, ver ese workflow para el
# detalle medido). Alimenta el ecosistema Supabase (dashboard/beta), en
# paralelo al pipeline de producción (Firestore/descarga_diaria.yml) — no
# lo reemplaza.
#
# Configuración en cron-job.org: 1 job, dispara cada 10 min SOLO en
# horario operativo (11:00-21:00 ART = 14:00-24:00 UTC, lunes a sábado) —
# de noche no entran paquetes nuevos al depósito, correrlo igual solo
# suma riesgo de choque con descarga_diaria.yml sin ganar nada.
#   URL:     https://api.github.com/repos/Mercadopacks/mercadopacks-metricas-diarias/actions/workflows/publicar_supabase.yml/dispatches
#   Método:  POST
#   Headers: Authorization: Bearer <PERSONAL_ACCESS_TOKEN>
#            Accept: application/vnd.github+json
#            Content-Type: application/json
#   Body:    {"ref":"main","inputs":{}}
#
# Secrets que necesita este workflow en GitHub (Settings > Secrets and
# variables > Actions), ADEMÁS de LIGHTDATA_USER/LIGHTDATA_PASS que ya
# existen para descarga_diaria.yml:
#   SUPABASE_URL               - URL del proyecto de Supabase (ecosistema beta)
#   SUPABASE_SERVICE_ROLE_KEY  - Service role key de ese mismo proyecto
#
# También se puede disparar a mano: pestaña "Actions" del repo > "Publicar
# a Supabase" > "Run workflow". "Fecha" vacío = hoy (ART).

on:
  workflow_dispatch:
    inputs:
      fecha:
        description: 'Fecha a descargar y subir (YYYY-MM-DD). Vacío = hoy (ART).'
        required: false
        default: ''

#
# Mismo grupo de concurrencia que descarga_diaria.yml (no uno propio): los
# dos workflows hacen login por Playwright contra la MISMA cuenta de
# LightData, así que tienen que encolarse entre sí, no solo contra sí
# mismos — si corren en paralelo, una sesión pisa a la otra a mitad del
# flujo de login/filtros (timeout real visto 2026-11-16 esperando el campo
# de fecha, mientras descarga_diaria.yml corría al mismo tiempo).
concurrency:
  group: descarga-lightdata
  cancel-in-progress: false

jobs:
  descargar-y-publicar:
    runs-on: ubuntu-latest
    # Misma imagen que descarga_diaria.yml (Python + Playwright/Chromium +
    # LibreOffice + requirements.txt ya instalados, incluye pandas/numpy que
    # usa publicar_supabase.py) — ver scripts/Dockerfile.
    container:
      image: ghcr.io/mercadopacks/mercadopacks-metricas-diarias/ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      # supabase/python-dotenv no están en requirements.txt (no corren en
      # el pipeline de producción todavía, ver publicar_supabase.py) — se
      # instalan aparte en cada corrida de este workflow.
      - name: Instalar dependencias extra (supabase, python-dotenv)
        working-directory: logistica-metricas/scripts
        run: pip install -r requirements_supabase.txt

      - name: Descargar de LightData y publicar a Supabase
        working-directory: logistica-metricas/scripts
        env:
          LIGHTDATA_USER: ${{ secrets.LIGHTDATA_USER }}
          LIGHTDATA_PASS: ${{ secrets.LIGHTDATA_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FECHA_INPUT: ${{ github.event.inputs.fecha }}
        run: |
          set -e
          if [ -n "$FECHA_INPUT" ]; then
            FECHA_DESCARGA="$FECHA_INPUT"
          else
            FECHA_DESCARGA=$(date -u -d "-3 hours" +%F)  # ART = UTC-3
          fi
          export FECHA_DESCARGA
          SALIDA=$(python3 descargar_lightdata.py)
          echo "$SALIDA"
          RUTA=$(echo "$SALIDA" | tail -n1 | sed 's/^Archivo descargado: //')
          python3 publicar_supabase.py "$RUTA"

      - name: Subir captura de pantalla si falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-publicar-supabase
          path: logistica-metricas/scripts/error_descarga.png
          if-no-files-found: ignore
