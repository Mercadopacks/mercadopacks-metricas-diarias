name: Descarga de LightData

# HISTORIAL IMPORTANTE — por qué este workflow NO usa `schedule:` de GitHub
# Actions para dispararse (aunque parezca la forma "obvia" de hacerlo):
#
# Se probó primero con `schedule: cron: ...` (incluso corriendo unos minutos
# después de la hora en punto, para evitar la congestión típica de "todo el
# mundo dispara justo a horario exacto"). Resultado medido con la API de
# GitHub sobre 5 días seguidos: la corrida programada para las 03:17 UTC
# arrancó siempre entre las 07:43 y las 08:25 UTC — una demora de 4h30' a
# 5h10', TODOS los días, no un pico ocasional. Ese nivel de demora es
# incompatible con el objetivo de tener 5 "fotos" del día a horarios
# puntuales (una foto de las 11:00 que arranca a las 15:30 no sirve).
#
# La solución: se dispara este workflow por `workflow_dispatch` (vía la API
# de GitHub) desde un servicio externo de cron (cron-job.org, gratuito), que
# no pasa por la cola interna de `schedule` y arranca casi al instante —
# igual que un disparo manual desde la pestaña Actions, que en las pruebas
# de este proyecto siempre arrancó a los pocos segundos.
#
# Configuración necesaria en cron-job.org (5 jobs, uno por horario):
#   URL:     https://api.github.com/repos/Mercadopacks/mercadopacks-metricas-diarias/actions/workflows/descarga_diaria.yml/dispatches
#   Método:  POST
#   Headers: Authorization: Bearer <PERSONAL_ACCESS_TOKEN>
#            Accept: application/vnd.github+json
#            Content-Type: application/json
#   Body:    {"ref":"main","inputs":{"modo":"hoy"}}   (4 jobs intradía)
#            {"ref":"main","inputs":{"modo":"ayer"}}  (1 job de cierre)
#   Horarios UTC (sin necesidad de offset ":17" — cron-job.org no sufre la
#   congestión de GitHub, así que van justo en punto):
#     14:00 UTC = 11:00 ART -> modo=hoy   (lunes a sábado)
#     16:00 UTC = 13:00 ART -> modo=hoy   (lunes a sábado)
#     18:00 UTC = 15:00 ART -> modo=hoy   (lunes a sábado)
#     21:00 UTC = 18:00 ART -> modo=hoy   (lunes a sábado)
#     03:00 UTC = 00:00 ART -> modo=ayer  (todos los días menos lunes —
#                                          ver chequeo de domingo más abajo,
#                                          que además protege por las dudas
#                                          cron-job.org se configure distinto)
# Ver README.md, sección "Automatización de la descarga diaria", para la
# guía completa de cómo generar el token y cargar los 5 jobs.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'Qué día traer: "hoy" (corridas intradía) o "ayer" (cierre de las 00hs). Vacío = "ayer" (compatibilidad con corridas manuales viejas).'
        required: false
        type: choice
        default: ''
        options:
          - ''
          - hoy
          - ayer
      fecha:
        description: 'Fecha puntual a descargar (YYYY-MM-DD), para backfill manual. Si se completa, ignora "modo" y tiene prioridad total.'
        required: false
        default: ''

# Evita que dos corridas se pisen entre sí (ej. una corrida que se atrasó y
# todavía sigue activa cuando llega la siguiente, o un disparo manual
# mientras corre una de cron-job.org). `cancel-in-progress: false` hace que
# la nueva corrida espere en cola en vez de cancelar la que ya está en
# curso — evita dejar a mitad de camino una sesión de Playwright ya logueada
# en LightData, y evita una carrera de lecturas/escrituras simultáneas
# contra el índice de Firestore (envios_index/index).
concurrency:
  group: descarga-lightdata
  cancel-in-progress: false

jobs:
  descargar-y-publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      # La operación es de lunes a sábado — los domingos no hay envíos
      # reales, solo se acumulan "A retirar", y cargar ese día falsearía las
      # métricas. Esto ya se configura en los horarios de cron-job.org (que
      # no debería llamar los domingos), pero se repite acá como red de
      # seguridad: si por error se dispara en domingo, esta corrida se
      # saltea sola en vez de publicar un snapshot inválido. No aplica si se
      # pide una fecha puntual de backfill (eso es una decisión explícita
      # de quien la pide).
      - name: Verificar que el día a procesar sea operativo (lunes a sábado)
        id: chequeo
        run: |
          if [ -n "${{ github.event.inputs.fecha }}" ]; then
            echo "saltar=false" >> "$GITHUB_OUTPUT"
          else
            if [ "${{ github.event.inputs.modo }}" = "ayer" ]; then
              dia_semana=$(date -u -d "yesterday" +%u)  # 1=lunes ... 7=domingo
            else
              dia_semana=$(date -u +%u)
            fi
            if [ "$dia_semana" = "7" ]; then
              echo "saltar=true" >> "$GITHUB_OUTPUT"
            else
              echo "saltar=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Configurar Python
        if: steps.chequeo.outputs.saltar != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar LibreOffice (respaldo para .xls con BIFF corrupto)
        if: steps.chequeo.outputs.saltar != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-calc

      - name: Instalar dependencias
        if: steps.chequeo.outputs.saltar != 'true'
        working-directory: logistica-metricas/scripts
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Descargar export de LightData
        if: steps.chequeo.outputs.saltar != 'true'
        id: descarga
        working-directory: logistica-metricas/scripts
        env:
          LIGHTDATA_USER: ${{ secrets.LIGHTDATA_USER }}
          LIGHTDATA_PASS: ${{ secrets.LIGHTDATA_PASS }}
          FECHA_DESCARGA: ${{ github.event.inputs.fecha }}
          MODO_FECHA: ${{ github.event.inputs.modo }}
        run: |
          set -e
          SALIDA=$(python descargar_lightdata.py)
          echo "$SALIDA"
          RUTA=$(echo "$SALIDA" | tail -n1 | sed 's/^Archivo descargado: //')
          echo "ruta=$RUTA" >> "$GITHUB_OUTPUT"

      # publicar_firestore.py escribe con `.set()` (reemplaza el documento
      # completo de esa fecha, no lo fusiona registro por registro) y agrega
      # la fecha al índice sin tocar las demás fechas ya cargadas — por eso
      # una corrida intradía "pisa" el snapshot del día sin duplicar nada, y
      # el histórico de días anteriores queda intacto sin ningún cambio
      # adicional acá.
      - name: Publicar snapshot en Firestore
        if: steps.chequeo.outputs.saltar != 'true'
        working-directory: logistica-metricas/scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python publicar_firestore.py "${{ steps.descarga.outputs.ruta }}"

      # El .xls crudo (con datos personales de destinatarios) NO se commitea
      # al repo — es público. Solo el snapshot agregado llega a Firestore.
      # Si algo falla antes de llegar acá, esta captura ayuda a diagnosticar
      # sin tener que reproducirlo a mano ni pedir credenciales por chat.
      - name: Subir captura de pantalla si falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-descarga-lightdata
          path: logistica-metricas/scripts/error_descarga.png
          if-no-files-found: ignore
