<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mercado Packs — Beta (Supabase)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.454.0/dist/umd/lucide.min.js"></script>
<style>
  :root{
    --dorado:#F6BE05; --negro:#111; --fondo:#efeeea; --borde:#ddd9d0;
    --sidebar-w:264px; --sidebar-w-colapsado:68px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Nunito',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--fondo); color:var(--negro);
  }
  button{cursor:pointer; border:none; border-radius:8px; font-size:14px; font-weight:700; font-family:inherit;}

  /* ===================== Marca ===================== */
  .marca-nombre{font-weight:800;}
  .marca-nombre .mercado{color:var(--negro);}
  .marca-nombre .packs{color:var(--dorado);}

  /* ===================== Login ===================== */
  #login-view{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
  }
  #login-view .caja{
    display:flex; flex-direction:column; align-items:center; gap:26px; width:320px;
  }
  #login-view .marca-row{display:flex; align-items:center; gap:12px;}
  #login-view .marca-row img.logo{width:52px; height:52px; flex-shrink:0;}
  #login-view h1.marca-nombre{font-size:24px; margin:0; line-height:1;}
  #login-view form{display:flex; flex-direction:column; gap:12px; width:100%;}
  #login-view input{
    padding:11px 13px; border:1px solid var(--borde); border-radius:8px; font-size:14px;
    font-family:inherit;
  }
  #login-error{color:#c0392b; font-size:13px; min-height:18px; text-align:center;}
  .btn-primario{background:var(--dorado); color:var(--negro); padding:11px 16px;}

  /* ===================== Botones de ícono (Lucide) ===================== */
  .btn-icono{
    background:var(--negro); color:#fff; border-radius:8px; padding:9px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .btn-icono:hover{background:#2a2a2a;}
  .btn-icono svg{width:18px; height:18px;}

  /* ===================== App shell: sidebar + contenido ===================== */
  #app-view{display:flex; min-height:100vh;}

  .sidebar{
    width:var(--sidebar-w); flex-shrink:0; background:var(--negro); color:#fff;
    display:flex; flex-direction:column; transition:width .18s ease;
    overflow:hidden;
  }
  .sidebar.colapsado{width:var(--sidebar-w-colapsado);}

  .sidebar-header{
    display:flex; align-items:center; gap:12px; padding:18px 16px;
    border-bottom:1px solid #2a2a2a; min-height:64px;
  }
  .sidebar-header img{width:28px; height:28px; flex-shrink:0;}
  .sidebar-header .marca-nombre{font-size:16px; white-space:nowrap;}
  .sidebar-header .mercado{color:#fff;}
  .sidebar-toggle{
    background:transparent; color:#aaa; padding:8px; margin-left:auto; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .sidebar-toggle:hover{color:#fff;}
  .sidebar-toggle svg{width:18px; height:18px;}
  .sidebar.colapsado .sidebar-header{justify-content:center; padding:18px 0;}
  .sidebar.colapsado .sidebar-header img,
  .sidebar.colapsado .sidebar-header .marca-nombre{display:none;}
  .sidebar.colapsado .sidebar-toggle{margin-left:0;}

  .sidebar nav{display:flex; flex-direction:column; gap:4px; padding:12px 10px;}
  .nav-item{
    display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:8px;
    color:#ccc; background:transparent; text-align:left; font-weight:600; width:100%;
    white-space:nowrap;
  }
  .nav-item svg{width:18px; height:18px; flex-shrink:0;}
  .nav-item:hover{background:#1e1e1e; color:#fff;}
  .nav-item.activo{background:var(--dorado); color:var(--negro);}
  .sidebar.colapsado .nav-item{justify-content:center; padding:12px 0;}
  .sidebar.colapsado .nav-item .texto{display:none;}

  #contenido{flex:1; min-width:0;}
  #contenido header{
    background:#fff; border-bottom:1px solid var(--borde); padding:14px 24px;
    display:flex; align-items:center; justify-content:space-between; min-height:64px;
  }
  #contenido header h2{font-size:16px; margin:0; font-weight:700;}
  main{max-width:1000px; margin:0 auto; padding:24px 20px;}
  .card{
    background:#fff; border:1px solid var(--borde); border-radius:12px;
    padding:20px; margin-bottom:16px;
  }
  .kpis{display:flex; gap:16px; flex-wrap:wrap;}
  .kpi{flex:1; min-width:160px;}
  .kpi .valor{font-size:28px; font-weight:800;}
  .kpi .label{font-size:13px; color:#555;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th, td{text-align:left; padding:8px 6px; border-bottom:1px solid var(--borde);}
  th{color:#555; font-weight:700;}
  .proximamente{text-align:center; padding:60px 20px; color:#777;}
  [hidden]{display:none !important;}
</style>
</head>
<body>

<div id="login-view">
  <div class="caja">
    <div class="marca-row">
      <img class="logo" src="../assets/logo-mp.png" alt="Mercado Packs" />
      <h1 class="marca-nombre"><span class="mercado">Mercado</span> <span class="packs">Packs</span></h1>
    </div>
    <form id="login-form">
      <input id="login-email" type="email" placeholder="Email" autocomplete="username" required />
      <input id="login-password" type="password" placeholder="Contraseña" autocomplete="current-password" required />
      <div id="login-error"></div>
      <button type="submit" class="btn-primario">Ingresar</button>
    </form>
  </div>
</div>

<div id="app-view" hidden>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <img src="../assets/logo-mp.png" alt="Mercado Packs" />
      <span class="marca-nombre"><span class="mercado">Mercado</span> <span class="packs">Packs</span></span>
      <button class="sidebar-toggle" id="sidebar-toggle" title="Desplegar/ocultar menú">
        <i data-lucide="menu"></i>
      </button>
    </div>
    <nav>
      <button class="nav-item activo" data-vista="envios">
        <i data-lucide="package"></i><span class="texto">Seguimiento de Envíos</span>
      </button>
      <button class="nav-item" data-vista="repartidores">
        <i data-lucide="truck"></i><span class="texto">Seguimiento de Repartidores</span>
      </button>
    </nav>
  </div>

  <div id="contenido">
    <header>
      <h2 id="titulo-vista">Seguimiento de Envíos</h2>
      <button id="logout-btn" class="btn-icono" title="Cerrar sesión">
        <i data-lucide="log-out"></i>
      </button>
    </header>

    <main>
      <div id="vista-envios">
        <div class="card">
          <div class="kpis">
            <div class="kpi"><div class="valor" id="kpi-total">—</div><div class="label">Envíos cargados</div></div>
            <div class="kpi"><div class="valor" id="kpi-historial">—</div><div class="label">Cambios registrados (historial)</div></div>
            <div class="kpi"><div class="valor" id="kpi-actualizado">—</div><div class="label">Última actualización</div></div>
          </div>
        </div>
        <div class="card">
          <h3 style="margin-top:0;">Últimos envíos actualizados</h3>
          <table>
            <thead>
              <tr><th>Estado</th><th>Cadete</th><th>Zona</th><th>Localidad</th><th>Fecha Mercadopacks</th></tr>
            </thead>
            <tbody id="tabla-envios"></tbody>
          </table>
        </div>
      </div>

      <div id="vista-repartidores" hidden>
        <div class="card proximamente">
          <p>Seguimiento de Repartidores todavía no se migró a esta base — es el próximo paso del plan.</p>
        </div>
      </div>
    </main>
  </div>
</div>

<script>
(function(){
  "use strict";

  // Publishable key: pensada para ir expuesta en el navegador. La
  // protección real la dan las políticas RLS de Supabase (solo usuarios
  // autenticados pueden leer `envios`/`envios_historial`), no el secreto
  // de esta clave.
  const SUPABASE_URL = "https://pxbovlghjljrbrpjtcpr.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_ap5oFuGA3ByxzbewtCVjmA_aP4IRY4M";

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  lucide.createIcons();

  const loginView = document.getElementById("login-view");
  const appView = document.getElementById("app-view");
  const loginForm = document.getElementById("login-form");
  const loginError = document.getElementById("login-error");
  const logoutBtn = document.getElementById("logout-btn");

  // Supabase devuelve mensajes en inglés y, a propósito, no distingue
  // "no existe el usuario" de "contraseña incorrecta" (evita que alguien
  // use el login para averiguar qué emails están registrados) — acá solo
  // se traduce el mensaje a algo claro, sin inventar una distinción que
  // el propio Supabase tampoco da.
  function mensajeErrorLogin(error){
    const msg = (error && error.message || "").toLowerCase();
    if(msg.includes("invalid login credentials")){
      return "Email o contraseña incorrectos.";
    }
    if(msg.includes("email not confirmed")){
      return "Esta cuenta todavía no fue confirmada.";
    }
    if(msg.includes("too many requests") || msg.includes("rate limit")){
      return "Demasiados intentos — esperá un momento y volvé a probar.";
    }
    return "No se pudo iniciar sesión. Intentá de nuevo.";
  }

  function mostrarApp(){
    loginView.hidden = true;
    appView.hidden = false;
    cargarDatosEnvios();
  }

  function mostrarLogin(){
    appView.hidden = true;
    loginView.hidden = false;
  }

  loginForm.addEventListener("submit", async (e)=>{
    e.preventDefault();
    loginError.textContent = "";
    const email = document.getElementById("login-email").value.trim();
    const password = document.getElementById("login-password").value;
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if(error){ loginError.textContent = mensajeErrorLogin(error); return; }
    mostrarApp();
  });

  logoutBtn.addEventListener("click", async ()=>{
    await sb.auth.signOut();
    mostrarLogin();
  });

  // ===================== Sidebar: navegación + colapsar =====================
  const sidebar = document.getElementById("sidebar");
  document.getElementById("sidebar-toggle").addEventListener("click", ()=>{
    sidebar.classList.toggle("colapsado");
  });

  const vistas = {
    envios: { titulo: "Seguimiento de Envíos", el: document.getElementById("vista-envios") },
    repartidores: { titulo: "Seguimiento de Repartidores", el: document.getElementById("vista-repartidores") },
  };

  document.querySelectorAll(".nav-item").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const v = btn.dataset.vista;
      document.querySelectorAll(".nav-item").forEach(b=>b.classList.toggle("activo", b===btn));
      Object.entries(vistas).forEach(([key, cfg])=>{ cfg.el.hidden = key !== v; });
      document.getElementById("titulo-vista").textContent = vistas[v].titulo;
    });
  });

  async function cargarDatosEnvios(){
    const [{ count: totalEnvios }, { count: totalHistorial }, { data: ultimos, error }] = await Promise.all([
      sb.from("envios").select("id_interno", { count: "exact", head: true }),
      sb.from("envios_historial").select("id", { count: "exact", head: true }),
      sb.from("envios")
        .select("estado,cadete,zona,localidad,fecha_mercadopacks,updated_at")
        .order("updated_at", { ascending: false })
        .limit(20),
    ]);

    document.getElementById("kpi-total").textContent = totalEnvios ?? "—";
    document.getElementById("kpi-historial").textContent = totalHistorial ?? "—";

    if(error){
      console.error("Error cargando envios:", error);
      document.getElementById("kpi-actualizado").textContent = "Error";
      return;
    }

    if(ultimos && ultimos.length){
      document.getElementById("kpi-actualizado").textContent =
        new Date(ultimos[0].updated_at).toLocaleString("es-AR");
    }

    const tbody = document.getElementById("tabla-envios");
    tbody.innerHTML = (ultimos || []).map(fila => `
      <tr>
        <td>${fila.estado ?? "—"}</td>
        <td>${fila.cadete ?? "—"}</td>
        <td>${fila.zona ?? "—"}</td>
        <td>${fila.localidad ?? "—"}</td>
        <td>${fila.fecha_mercadopacks ?? "—"}</td>
      </tr>
    `).join("");
  }

  // Al cargar la página, y ante cualquier cambio de sesión (login/logout
  // en otra pestaña, token vencido, etc.), decide qué vista mostrar.
  sb.auth.onAuthStateChange((_event, session)=>{
    if(session) mostrarApp(); else mostrarLogin();
  });

  sb.auth.getSession().then(({ data: { session } })=>{
    if(session) mostrarApp(); else mostrarLogin();
  });
})();
</script>
</body>
</html>
